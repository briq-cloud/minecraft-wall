name: checks
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -p 'test_*.py'
      - run: node test_controller_ui.cjs
      - run: bash -n desktop.sh install.sh run.sh
